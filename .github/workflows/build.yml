name: Build APK

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Set git init default branch to master
        run: git config --global init.defaultBranch master

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      # --- Install NDK only if not already pre-installed on runner ---
      - name: Install NDK (skip if present)
        run: |
          NDK_DIR="$ANDROID_HOME/ndk/27.0.12077973"
          if [ -d "$NDK_DIR" ]; then
            echo "NDK 27.0.12077973 already present, skipping install"
          else
            echo "NDK not found, installing..."
            sdkmanager "ndk;27.0.12077973" --sdk_root=$ANDROID_HOME
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Restore signing keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            mkdir -p "$RUNNER_TEMP/ks"
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ks/kiloproxy-release.jks"
          fi

      # --- Build: all ABIs + universal (universal contains all 4 .so sets; OS picks best at runtime) ---
      - name: Run unit tests
        run: gradle testDebugUnitTest --warning-mode all
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973

      - name: Build Release APK
        run: |
          echo "Building universal + per-ABI APKs (all ABIs)"
          gradle assembleRelease --warning-mode all
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          KILO_KEYSTORE_FILE: ${{ runner.temp }}/ks/kiloproxy-release.jks
          KILO_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KILO_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KILO_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Compute version code
        id: vc
        run: echo "code=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_OUTPUT"

      # Append the app version to the APK filenames (read from the built APK
      # itself so tag builds and branch builds always get the right name).
      - name: Rename APK with version name
        run: |
          cd app/build/outputs/apk/release
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | tail -n 1)
          VN=$($AAPT dump badging "$(ls *.apk | head -n 1)" 2>/dev/null \
            | grep -oP "versionName='\K[^']+" | head -n 1)
          for f in *.apk; do
            mv -f "$f" "${f%.apk}-v${VN}.apk"
          done
          echo "Renamed APKs to:"
          ls -1

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk

      # Build a plain-text changelog from commits since the last release tag:
      # human-readable subjects only (no hashes - the dialog already shows
      # its own version line and "What's new" heading, so no boilerplate).
      - name: Generate changelog
        id: changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            LOG=$(git log --format=%s --no-merges "$PREV..HEAD")
          else
            LOG=$(git log --format=%s --no-merges -20)
          fi
          # Release notes are plain ASCII: strip emoji/symbols from subjects.
          LOG=$(printf '%s\n' "$LOG" | LC_ALL=C tr -cd '[:print:]\t\n')
          echo "$LOG" > changelog.md
          echo "Changelog:"
          cat changelog.md

      # Publish only on real branch pushes (not PRs, not tag-triggered runs —
      # tag pushes would create a new tag each run and loop releases).
      - name: Publish GitHub Release (v${{ steps.vc.outputs.code }})
        if: github.ref_type == 'branch' && github.event_name == 'push'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.vc.outputs.code }}
          name: v${{ steps.vc.outputs.code }}
          body_path: changelog.md
          files: app/build/outputs/apk/release/*.apk
